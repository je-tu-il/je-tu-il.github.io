<!DOCTYPE html>
<html data-atelier-app="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HandTrack Draw — HTML5 + MediaPipe</title>
  <meta name="description" content="HandTrack Draw — HTML5 + MediaPipe — Application interactive et démonstration en ligne.">
  <!-- Minimal reset & layout -->
  <style>
    :root{
      --bg:#0b0d10; --panel:#12151a; --muted:#778; --text:#e8eef7; --accent:#6aa7ff; --accent2:#7ef0d8;
      --border: #1f242d; --danger:#ff6b6b; --warning:#ffd166;
    }
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Ubuntu,"Helvetica Neue",Arial}
    .app{display:grid;grid-template-columns:72px 1fr;grid-template-rows:auto 1fr;gap:12px; height:100vh; padding:12px}
    header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:8px 12px}
    header .title{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px}
    header .title .dot{width:10px;height:10px;border-radius:50%;background:var(--accent2);box-shadow:0 0 16px var(--accent2)}
    header .actions{display:flex;align-items:center;gap:8px}
    .btn{appearance:none;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:8px 10px;border-radius:12px;cursor:pointer;transition:transform .08s ease, background .2s}
    .btn:hover{background:#181c22}
    .btn:active{transform:translateY(1px)}
    .toolbar{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:10px;align-items:center}
    .tool{width:48px;height:48px;border-radius:14px;border:1px solid var(--border);display:grid;place-items:center;background:#0f1318;cursor:pointer;position:relative;user-select:none}
    .tool.active{outline:2px solid var(--accent); box-shadow:0 0 0 3px #0c1117}
    .tool:hover{background:#141922}
    .tool:after{content:attr(data-tip); position:absolute; left:56px; top:50%; transform:translateY(-50%); background:#0f1318; border:1px solid var(--border); padding:3px 8px; border-radius:8px; font-size:12px; color:var(--muted); white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s}
    .tool:hover:after{opacity:1}
    .separator{height:1px;width:100%;background:var(--border);margin:6px 0}
    .color-row{display:flex;flex-direction:column;gap:8px; align-items:center}
    .swatches{display:grid; grid-template-columns:repeat(3, 18px); gap:6px}
    .swatch{width:18px;height:18px;border-radius:6px;border:1px solid var(--border);cursor:pointer}
    .range{writing-mode: bt-lr; -webkit-appearance: slider-vertical; height:120px; width:28px}

    /* Stage */
    .stage{position:relative;background:#0a0e13;border:1px solid var(--border); border-radius:18px; overflow:hidden}
    video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); filter:brightness(.95) saturate(.9) contrast(1.1)}
    canvas{position:absolute; left:0; top:0}
    #overlay{pointer-events:none}
    .badge{position:absolute; right:10px; top:10px; background:#0f1318; border:1px solid var(--border); border-radius:999px; padding:6px 10px; font-size:12px; color:var(--muted)}

    /* Gesture-hover buttons (for dwell activation) */
    .floating-ui{position:absolute; left:12px; bottom:12px; display:flex; gap:8px}
    .pill{border:1px solid var(--border); background:rgba(20,24,30,.8); backdrop-filter: blur(6px); color:var(--text); padding:8px 12px; border-radius:999px; font-size:14px}
    .pill[data-gesture-target]{outline:1px dashed transparent}
    .pill.g-armed{outline-color:var(--accent)}

    .hint{font-size:12px; color:var(--muted)}
    .kbd{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; background:#0f1318;border:1px solid var(--border); padding:2px 6px; border-radius:6px}
  </style>

  <!-- MediaPipe Hands (legacy) CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script defer src="../../assets/portfolio-back.js?v=atelier-2"></script>
  <link rel="stylesheet" href="../../assets/atelier-app.css?v=1">
</head>
<body>
  <div class="app">
    <header>
      <div class="title"><span class="dot"></span> HandTrack Draw <span class="hint">• Pinch to draw • Open palm to hover</span></div>
      <div class="actions">
        <button id="toggleCam" class="btn">Toggle Camera</button>
        <button id="savePng" class="btn">Save PNG</button>
        <button id="clear" class="btn" title="Clear Canvas (gesture: open palm + dwell on Clear)">Clear</button>
        <span class="hint">Tip: hold your index & thumb together to draw. Dwell finger on buttons to activate.</span>
      </div>
    </header>

    <aside class="toolbar" id="toolbar">
      <div class="tool active" id="tool-pen" data-tip="Pen" data-tool="pen" data-gesture-target>
        ✍️
      </div>
      <div class="tool" id="tool-eraser" data-tip="Eraser" data-tool="eraser" data-gesture-target>
        🧽
      </div>
      <div class="separator"></div>
      <div class="color-row">
        <div class="swatches" id="swatches"></div>
        <input id="color" type="color" value="#6aa7ff" class="tool" title="Pick Color"/>
      </div>
      <div class="separator"></div>
      <input id="size" class="range" type="range" min="2" max="40" value="8" />
      <div class="hint">Brush</div>
      <div class="separator"></div>
      <div class="tool" id="undo" data-tip="Undo" data-gesture-target>↶</div>
      <div class="tool" id="redo" data-tip="Redo" data-gesture-target>↷</div>
    </aside>

    <main class="stage" id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <canvas id="draw"></canvas>
      <div class="badge" id="status">Loading…</div>

      <div class="floating-ui">
        <div class="pill" id="pill-pen" data-gesture-target>Pen</div>
        <div class="pill" id="pill-eraser" data-gesture-target>Eraser</div>
        <div class="pill" id="pill-clear" data-gesture-target>Clear</div>
      </div>
    </main>
  </div>

<script>
(function(){
  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const draw = document.getElementById('draw');
  const stage = document.getElementById('stage');
  const statusEl = document.getElementById('status');

  const toggleCamBtn = document.getElementById('toggleCam');
  const saveBtn = document.getElementById('savePng');
  const clearBtn = document.getElementById('clear');

  const swatchesEl = document.getElementById('swatches');
  const colorInput = document.getElementById('color');
  const sizeInput = document.getElementById('size');

  const toolbar = document.getElementById('toolbar');
  const toolPen = document.getElementById('tool-pen');
  const toolEraser = document.getElementById('tool-eraser');
  const undoBtn = document.getElementById('undo');
  const redoBtn = document.getElementById('redo');

  const pillPen = document.getElementById('pill-pen');
  const pillEraser = document.getElementById('pill-eraser');
  const pillClear = document.getElementById('pill-clear');

  const swatchColors = ['#6aa7ff','#7ef0d8','#ffd166','#ff6b6b','#f78c6c','#c792ea','#89ddff','#e8eef7','#94f7a0'];

  // State
  let activeTool = 'pen';
  let drawingColor = colorInput.value;
  let lineWidth = +sizeInput.value;
  let isCameraOn = true;

  let cxDraw = draw.getContext('2d');
  let cxOver = overlay.getContext('2d');

  // Undo/redo via snapshots
  const history = []; const redoStack = []; const MAX_HISTORY = 30;
  function snapshot(){
    try{ history.push(cxDraw.getImageData(0,0,draw.width,draw.height)); if(history.length>MAX_HISTORY) history.shift(); redoStack.length=0; }catch(e){ /* tainted canvas, skip */ }
  }
  function undo(){ if(!history.length) return; redoStack.push(cxDraw.getImageData(0,0,draw.width,draw.height)); const img = history.pop(); cxDraw.clearRect(0,0,draw.width,draw.height); if(img) cxDraw.putImageData(img,0,0); }
  function redo(){ if(!redoStack.length) return; history.push(cxDraw.getImageData(0,0,draw.width,draw.height)); const img = redoStack.pop(); if(img) cxDraw.putImageData(img,0,0); }

  undoBtn.onclick=undo; redoBtn.onclick=redo;

  // Build swatches
  swatchColors.forEach(c=>{
    const s=document.createElement('div'); s.className='swatch'; s.style.background=c; s.title=c; s.onclick=()=>{ drawingColor=c; colorInput.value=c; setTool('pen'); };
    s.setAttribute('data-gesture-target','');
    swatchesEl.appendChild(s);
  });

  colorInput.addEventListener('input', e=>{ drawingColor = e.target.value; setTool('pen'); });
  sizeInput.addEventListener('input', e=>{ lineWidth = +e.target.value; });

  clearBtn.onclick = ()=>{ cxDraw.clearRect(0,0,draw.width,draw.height); history.length=0; redoStack.length=0; };

  saveBtn.onclick = ()=>{
    const tmp = document.createElement('canvas'); tmp.width=draw.width; tmp.height=draw.height;
    const c = tmp.getContext('2d');
    // compose camera frame (optional): here we export drawing only for clean artwork
    c.drawImage(draw,0,0);
    const a=document.createElement('a'); a.href=tmp.toDataURL('image/png'); a.download='handtrack-drawing.png'; a.click();
  };

  toggleCamBtn.onclick = ()=>{ isCameraOn = !isCameraOn; video.style.display = isCameraOn ? 'block' : 'none'; };

  function setTool(t){ activeTool=t; [toolPen, toolEraser].forEach(el=>el.classList.remove('active')); (t==='pen'?toolPen:toolEraser).classList.add('active'); }
  toolPen.onclick=()=>setTool('pen'); toolEraser.onclick=()=>setTool('eraser');

  // Resize stage & canvases
  function fit(){
    const r = stage.getBoundingClientRect();
    [overlay,draw].forEach(cv=>{ cv.width = r.width; cv.height = r.height; });
  }
  addEventListener('resize', fit);
  fit();

  // ===================== MediaPipe Hands =====================
  let lastPt = null; // last drawing point in pixels
  let pinched = false; // whether we are currently drawing
  let dwellTarget = null, dwellStart = 0, DWELL_MS = 650;

  const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
  });

  hands.onResults(onResults);

  async function setupCamera(){
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'user' }, audio:false });
    video.srcObject = stream; await video.play();

    const cam = new  window.Camera(video, { onFrame: async () => { await hands.send({image: video}); }, width: 1280, height: 720 });
    cam.start();
    statusEl.textContent = 'Ready • Pinch to draw';
  }

  setupCamera().catch(err=>{ statusEl.textContent = 'Camera error: '+err.message; console.error(err); });

  function onResults(res){
    const w = overlay.width, h = overlay.height;
    cxOver.clearRect(0,0,w,h);

    // Mirror horizontally to match the mirrored video
    function toPx(norm){ return { x:(1-norm.x)*w, y:norm.y*h } }

    if(res.multiHandLandmarks && res.multiHandLandmarks.length){
      const lm = res.multiHandLandmarks[0];
      const i8 = lm[8]; // index fingertip
      const t4 = lm[4]; // thumb tip

      const p = toPx(i8);
      const thumb = toPx(t4);

      // Cursor circle
      cxOver.beginPath(); cxOver.arc(p.x, p.y, 10, 0, Math.PI*2); cxOver.strokeStyle = '#3a4760'; cxOver.lineWidth = 2; cxOver.stroke();

      // Landmarks miroir uniquement pour l'affichage
	const mirroredLm = lm.map(pt => ({ x: 1 - pt.x, y: pt.y, z: pt.z }));

	window.drawConnectors && window.drawConnectors(cxOver, mirroredLm, window.HAND_CONNECTIONS, {color:'#203044', lineWidth:2});
	window.drawLandmarks && window.drawLandmarks(cxOver, mirroredLm, {color:'#2a3952', lineWidth:1});


      // Pinch detection
      const dx = (i8.x - t4.x), dy = (i8.y - t4.y);
      const dist = Math.hypot(dx,dy); // normalized
      const PINCH_ON = 0.05, PINCH_OFF = 0.07; // hysteresis

      if(!pinched && dist < PINCH_ON){
        pinched = true; lastPt = p; snapshot();
      } else if(pinched && dist > PINCH_OFF){
        pinched = false; lastPt = null;
      }

      // Draw or erase while pinched
      if(pinched){
        cxDraw.save();
        if(activeTool==='eraser'){
          cxDraw.globalCompositeOperation = 'destination-out';
          cxDraw.strokeStyle = 'rgba(0,0,0,1)';
          cxDraw.lineWidth = lineWidth * 2.2;
        } else {
          cxDraw.globalCompositeOperation = 'source-over';
          cxDraw.strokeStyle = drawingColor;
          cxDraw.lineWidth = lineWidth;
        }
        cxDraw.lineJoin = cxDraw.lineCap = 'round';
        cxDraw.beginPath();
        const lp = lastPt || p; cxDraw.moveTo(lp.x, lp.y); cxDraw.lineTo(p.x, p.y); cxDraw.stroke();
        cxDraw.restore();
        lastPt = p;
      }

      // ======= Gesture dwell to click UI elements =======
      gestureDwellHit(p);

    } else {
      // no hands
      pinched = false; lastPt = null;
    }
  }

  function elementRect(el){
    const r = el.getBoundingClientRect();
    const sr = stage.getBoundingClientRect();
    return { left: r.left - sr.left, top: r.top - sr.top, width: r.width, height: r.height };
  }

  const gestureTargets = Array.from(document.querySelectorAll('[data-gesture-target]'));

  function gestureDwellHit(pt){
    let hit = null;
    for(const el of gestureTargets){
      const r = elementRect(el);
      if(pt.x >= r.left && pt.x <= r.left+r.width && pt.y >= r.top && pt.y <= r.top+r.height){ hit = el; break; }
    }
    const now = performance.now();
    if(hit){
      if(dwellTarget !== hit){ dwellTarget = hit; dwellStart = now; hit.classList.add('g-armed'); }
      else if(now - dwellStart > DWELL_MS){
        // Trigger action once, then cooldown
        dwellStart = now + 1e9; // effectively disable until exit
        hit.classList.remove('g-armed');
        activateElement(hit);
      }
    } else {
      if(dwellTarget){ dwellTarget.classList.remove('g-armed'); }
      dwellTarget = null; dwellStart = 0;
    }
  }

  function activateElement(el){
    if(el === toolPen || el === pillPen){ setTool('pen'); return; }
    if(el === toolEraser || el === pillEraser){ setTool('eraser'); return; }
    if(el === pillClear || el === clearBtn){ cxDraw.clearRect(0,0,draw.width,draw.height); history.length=0; redoStack.length=0; return; }
    if(el === undoBtn){ undo(); return; }
    if(el === redoBtn){ redo(); return; }
    if(el.classList.contains('swatch')){ drawingColor = el.style.backgroundColor; colorInput.value = rgbToHex(drawingColor); setTool('pen'); return; }
  }

  function rgbToHex(rgb){
    const m = rgb.match(/\d+/g); if(!m) return '#ffffff';
    return '#' + m.slice(0,3).map(x=>('0'+parseInt(x).toString(16)).slice(-2)).join('');
  }

  // Ensure canvases track video size
  const resizeObserver = new ResizeObserver(()=>{ fit(); });
  resizeObserver.observe(stage);
})();
</script>
</body>
</html>
