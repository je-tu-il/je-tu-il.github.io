<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fiche projet | Je-tu-il</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="stylesheet" href="../catalogue.css?v=atelier-2">
  <link rel="stylesheet" href="demo.css?v=atelier-3">
  <script defer src="../assets/portfolio-back.js?v=atelier-2"></script>
  <script defer src="../data/projects.js"></script>
  <script defer src="../data/readmes.js"></script>
  <script defer src="../data/markdown-renderer.js"></script>
  <script defer src="workflows.js"></script>
  <script defer src="interactive-demos.js?v=atelier-3"></script>
  <script defer src="project.js?v=atelier-4"></script>
</head>
<body>
  <a data-portfolio-back href="../index.html#catalogue" class="btn-back-portfolio" aria-label="Retour au portfolio" title="Retour au portfolio">←</a>
  <main class="page inner-page">
    <p id="projectMissing" hidden>Cette fiche est introuvable.</p>
    <div id="projectSheet" hidden>
      <header class="inner-cover">
        <p id="projectCategory" class="inner-label"></p>
        <h1 id="projectName"></h1>
        <p id="projectTagline"></p>
      </header>
      <div class="sheet-grid">
        <section class="inner-panel">
          <h2>Le projet</h2>
          <p id="projectDesc"></p>
          <ul id="featureList"></ul>
        </section>
        <aside class="inner-panel">
          <h2>Accès au projet</h2>
          <a id="liveDemoBtn" class="project-launch" hidden></a>
          <p id="guidedDemo" hidden><a id="guidedDemoLink">Essayer le parcours interactif</a></p>
          <div class="project-resources">
            <a id="downloadZipBtn" hidden>ZIP</a>
            <a id="githubBtn" hidden>GitHub</a>
          </div>
          <ul id="techStack" class="tech-stack" aria-label="Technologies"></ul>
        </aside>
      </div>
      <details id="readmeSection" class="inner-panel readme" hidden>
        <summary>Documentation du projet</summary>
        <div id="readmeRendered"></div>
      </details>
    </div>
  </main>
</body>
</html>
