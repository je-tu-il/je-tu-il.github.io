<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détails du Projet | Portfolio Je-tu-il</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090e17;
      --card: #111827;
      --border: #1f293d;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text: #f3f4f6;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 70px 20px 80px;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.1) 0%, transparent 60%),
        radial-gradient(circle at 80% 90%, rgba(168, 85, 247, 0.08) 0%, transparent 50%);
    }
    #back-to-hub {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 99999;
      background: rgba(17, 24, 39, 0.85);
      color: #38bdf8;
      padding: 9px 16px;
      border-radius: 9999px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(56, 189, 248, 0.3);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: all 0.2s ease;
    }
    #back-to-hub:hover {
      background: rgba(56, 189, 248, 0.2);
      transform: translateX(-2px);
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    .header-section {
      margin-bottom: 32px;
    }
    .meta-badges {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .badge {
      padding: 5px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-category {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
    }
    .badge-status {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
    }
    h1 {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      line-height: 1.2;
    }
    p.tagline {
      font-size: 18px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .tech-stack {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .tech-pill {
      background: #1a2234;
      border: 1px solid #28354f;
      color: #cbd5e1;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }
    .action-buttons {
      display: flex;
      gap: 14px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #000;
      font-weight: 800;
      font-size: 15px;
      padding: 13px 24px;
      border-radius: 12px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px var(--accent-glow);
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(56, 189, 248, 0.4);
    }
    .btn-secondary {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 700;
      font-size: 15px;
      padding: 13px 22px;
      border-radius: 12px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover {
      background: #1a2333;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      margin-bottom: 24px;
    }
    .section-card h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
    }
    .section-card p {
      font-size: 15px;
      color: #cbd5e1;
      line-height: 1.7;
      margin-bottom: 14px;
    }
    .feature-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .feature-bullet {
      color: var(--accent);
      font-size: 16px;
      line-height: 1;
    }
    .highlight-box {
      background: rgba(56, 189, 248, 0.06);
      border-left: 4px solid var(--accent);
      padding: 16px 20px;
      border-radius: 8px;
      font-size: 14px;
      color: #e2e8f0;
      line-height: 1.6;
    }
    .nav-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .nav-btn {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .nav-btn:hover { color: var(--accent); }
  </style>
</head>
<body>
  <a href="../index.html" id="back-to-hub">&larr; Portfolio</a>

  <div class="container">
    <div class="header-section">
      <div class="meta-badges">
        <span class="badge badge-category" id="projectCategory">Catégorie</span>
        <span class="badge badge-status" id="projectStatus">Statut</span>
      </div>

      <h1 id="projectTitle">
        <span id="projectIcon">🚀</span>
        <span id="projectName">Nom du projet</span>
      </h1>

      <p class="tagline" id="projectTagline">Description courte du projet...</p>

      <div class="tech-stack" id="techStack"></div>

      <div class="action-buttons">
        <a href="#" id="liveDemoBtn" class="btn-primary" style="display:none;">
          <span>✨ Tester en direct (Live Demo)</span>
        </a>
        <a href="https://github.com/je-tu-il" target="_blank" rel="noopener noreferrer" id="githubBtn" class="btn-secondary">
          <span>🐙 Voir sur GitHub</span>
        </a>
      </div>
    </div>

    <!-- Description & Architecture -->
    <div class="section-card">
      <h2>📘 Présentation & Architecture</h2>
      <p id="projectDesc">Chargement des détails...</p>
      <div class="highlight-box" id="projectHighlight"></div>
    </div>

    <!-- Features -->
    <div class="section-card">
      <h2>⚡ Fonctionnalités Clés</h2>
      <ul class="feature-list" id="featureList"></ul>
    </div>

    <div class="nav-footer">
      <a href="../index.html" class="nav-btn">&larr; Retour à la grille complète</a>
      <a href="https://github.com/je-tu-il" target="_blank" rel="noopener noreferrer" class="nav-btn">Profil GitHub @je-tu-il &rarr;</a>
    </div>
  </div>

  <script>
    async function loadProjectDetails() {
      const params = new URLSearchParams(window.location.search);
      const projectId = params.get('id') || 'demineur-ultime';

      try {
        const res = await fetch('../data/projects.json');
        if (!res.ok) throw new Error("Data fetch error");
        const projects = await res.json();
        const p = projects.find(item => item.id === projectId) || projects[0];

        document.title = `${p.title} | Portfolio Je-tu-il`;
        document.getElementById('projectCategory').innerText = p.categoryLabel || p.category;
        document.getElementById('projectStatus').innerText = p.status;
        document.getElementById('projectIcon').innerText = p.icon || '🚀';
        document.getElementById('projectName').innerText = p.title;
        document.getElementById('projectTagline').innerText = p.tagline;

        // Tech stack
        const techContainer = document.getElementById('techStack');
        techContainer.innerHTML = (p.techStack || []).map(t => `<span class="tech-pill">${t}</span>`).join('');

        // Action buttons
        const demoBtn = document.getElementById('liveDemoBtn');
        if (p.isRunnable && p.runnableUrl) {
          demoBtn.style.display = 'inline-flex';
          demoBtn.href = '../' + p.runnableUrl;
        } else {
          demoBtn.style.display = 'none';
        }

        const ghBtn = document.getElementById('githubBtn');
        if (p.githubUrl) ghBtn.href = p.githubUrl;

        // Content
        document.getElementById('projectDesc').innerText = p.description;
        document.getElementById('projectHighlight').innerText = p.highlights || "Architecture optimisée pour la performance et le respect des standards de sécurité.";

        // Features
        const featList = document.getElementById('featureList');
        featList.innerHTML = (p.features || []).map(f => `
          <li class="feature-item">
            <span class="feature-bullet">✦</span>
            <span>${f}</span>
          </li>
        `).join('');

      } catch (err) {
        console.error("Erreur de chargement du projet :", err);
      }
    }

    window.addEventListener('DOMContentLoaded', loadProjectDetails);
  </script>
</body>
</html>
