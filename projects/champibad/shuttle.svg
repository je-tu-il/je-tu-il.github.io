<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="100" height="100" rx="28" fill="#0B132B"/>
  
  <!-- Shuttlecock Head (Cork) -->
  <circle cx="50" cy="74" r="14" fill="url(#neon)" filter="url(#glow)"/>
  
  <!-- Shuttlecock Skirt / Feathers -->
  <path d="M50 64 L26 24 Q50 16 74 24 Z" fill="rgba(255, 255, 255, 0.15)" stroke="url(#neon)" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="50" y1="64" x2="38" y2="20" stroke="url(#neon)" stroke-width="1.8" stroke-dasharray="3 3"/>
  <line x1="50" y1="64" x2="50" y2="18" stroke="url(#neon)" stroke-width="2"/>
  <line x1="50" y1="64" x2="62" y2="20" stroke="url(#neon)" stroke-width="1.8" stroke-dasharray="3 3"/>
  
  <!-- Feather binding rings -->
  <path d="M33 36 Q50 30 67 36" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M39 48 Q50 43 61 48" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
</svg>
