<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game-DB</title>
<link rel="icon" href="./app-icon.png" type="image/png">
<style>
  :root { font: 100%/1.55 system-ui,sans-serif; color: #f6f3ee; background: #171719; color-scheme: dark; --accent: #c8c5ff; --panel: #222224; --muted: #ccc9c2; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .wrap { width: min(100% - 36px, 1000px); margin-inline: auto; }
  header { border-bottom: 1px solid #343438; }
  header .wrap { min-height: 65px; display: flex; align-items: center; gap: 11px; font-weight: 700; }
  header img { width: 40px; height: 40px; }
  main { padding-block: clamp(34px, 7vw, 75px); }
  h1 { font-size: clamp(2.5rem, 6vw, 4.8rem); line-height: 1; letter-spacing: -.06em; margin: 0 0 17px; text-wrap: balance; }
  h2 { margin: 0 0 6px; font-size: 1.2rem; }
  p { margin: 0 0 16px; color: var(--muted); max-width: 64ch; }
  a { color: var(--accent); text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .grid { margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 265px), 1fr)); gap: 14px; }
  .card { border: 1px solid #3e3e42; border-radius: 17px; padding: 18px; margin: 0; background: var(--panel); }
  .card p:last-child { margin-bottom: 0; }
  figure.card { padding: 0; overflow: hidden; }
  figure img { width: 100%; display: block; aspect-ratio: 4 / 3; object-fit: cover; }
  figcaption { padding: 11px 16px; }
  label { display: grid; gap: 5px; color: var(--muted); margin-block: 12px; }
  input { font: inherit; width: min(100%, 430px); }
  input[type=search] { border: 1px solid #59595d; border-radius: 8px; padding: 8px 11px; }
  ul { margin: 12px 0 0; padding-left: 20px; }
  li + li { margin-top: 8px; }
</style>
</head>
<body>
<header><div class="wrap"><img src="./app-icon.png" alt="">Game-DB</div></header>
<main class="wrap">
<h1>Catalogue de jeux</h1>
<p>Explorez les jeux de l’échantillon ou ouvrez un autre export Game-DB au format JSON.</p>
<p><a href="./mega_boardgame_db_sample.json">Ouvrir le fichier JSON d’exemple</a></p>
<label>Choisir un catalogue JSON
  <input id="catalog-file" type="file" accept=".json,application/json">
</label>
<label>Filtrer par nom de jeu
  <input id="catalog-search" type="search" placeholder="Ex. Catan" disabled>
</label>
<p id="catalog-status" role="status"></p>
<div id="catalog-games" class="grid"></div>
<script src="./catalog.js" defer></script>
</main>
</body>
</html>
