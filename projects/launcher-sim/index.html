<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launcher App Simulator | Raycast & Spotlight pour Windows</title>
  <meta name="description" content="Launcher App Simulator | Raycast & Spotlight pour Windows — Application interactive et démonstration en ligne.">
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 27, 34, 0.96);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --item-hover: rgba(56, 189, 248, 0.1);
      --item-selected: rgba(56, 189, 248, 0.16);
    }
    body.theme-oled {
      --card-bg: rgba(0, 0, 0, 0.98);
      --border-color: rgba(255, 255, 255, 0.12);
    }
    body.theme-light {
      --bg: #e2e8f0;
      --card-bg: rgba(255, 255, 255, 0.95);
      --border-color: rgba(0, 0, 0, 0.1);
      --text: #0f172a;
      --muted: #64748b;
      --item-hover: rgba(56, 189, 248, 0.08);
      --item-selected: rgba(56, 189, 248, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 40px;
      transition: background-color 0.3s;
      background-image: radial-gradient(circle at 50% 10%, rgba(56, 189, 248, 0.08) 0%, transparent 60%);
    }
    #back-to-hub {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 99999;
      background: rgba(17, 24, 39, 0.85);
      color: #38bdf8;
      padding: 9px 16px;
      border-radius: 9999px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(56, 189, 248, 0.3);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: all 0.2s ease;
    }
    #back-to-hub:hover {
      background: rgba(56, 189, 248, 0.2);
      transform: translateX(-2px);
    }
    .header-bar {
      text-align: center;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    p.hint {
      color: var(--muted);
      font-size: 14px;
    }
    kbd {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
    }
    /* Launcher Window */
    .launcher-modal {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--border-color);
      backdrop-filter: blur(24px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .tabs-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 18px 4px;
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }
    .tab-btn.active {
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
    }
    .search-row {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }
    .search-icon {
      color: var(--muted);
      font-size: 18px;
    }
    .locked-pill {
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      display: none;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .locked-pill .close-pill {
      cursor: pointer;
      font-weight: 800;
    }
    #launcherInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 17px;
      font-weight: 500;
      color: var(--text);
    }
    #launcherInput::placeholder {
      color: var(--muted);
    }
    .results-list {
      max-height: 380px;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .result-item:hover, .result-item.selected {
      background: var(--item-selected);
    }
    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .item-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .item-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .item-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-sub {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-meta {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 3px 8px;
      border-radius: 6px;
    }
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      border-top: 1px solid var(--border-color);
      font-size: 11px;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.2);
    }
    .shortcuts-help {
      display: flex;
      gap: 12px;
    }
    .theme-switcher {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .theme-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .theme-btn.active {
      color: var(--accent);
      border-color: var(--accent);
    }
    /* Action Toast */
    #actionToast {
      position: fixed;
      bottom: 24px;
      background: #10b981;
      color: #000;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 999;
    }
    #actionToast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
  <script defer src="../../assets/portfolio-back.js"></script>
</head>
<body>

  <div class="header-bar">
    <div class="badge">🚀 Projet Launcher App • Python & AHK</div>
    <h1>Simulateur Launcher App</h1>
    <p class="hint">Naviguez avec <kbd>↑</kbd> <kbd>↓</kbd> • Entrée pour lancer • <kbd>Tab</kbd> pour verrouiller un artiste audio</p>
  </div>

  <div class="launcher-modal" id="launcherWindow">
    <div class="tabs-bar">
      <button class="tab-btn active" data-tab="all" onclick="selectTab('all')">🌟 Tout</button>
      <button class="tab-btn" data-tab="portable" onclick="selectTab('portable')">💼 Portables</button>
      <button class="tab-btn" data-tab="notes" onclick="selectTab('notes')">📝 Notes</button>
      <button class="tab-btn" data-tab="music" onclick="selectTab('music')">🎵 Musique</button>
      <button class="tab-btn" data-tab="discover" onclick="selectTab('discover')">🧭 Découverte</button>
      <button class="tab-btn" data-tab="games" onclick="selectTab('games')">🎮 Jeux</button>
    </div>

    <div class="search-row">
      <span class="search-icon">🔍</span>
      <div class="locked-pill" id="lockedPill">
        <span id="lockedPillText">🎵 Daft Punk</span>
        <span class="close-pill" onclick="unlockArtist()">✕</span>
      </div>
      <input type="text" id="launcherInput" placeholder="Rechercher une application, une note ou un artiste..." autofocus>
    </div>

    <div class="results-list" id="resultsList"></div>

    <div class="bottom-bar">
      <div class="shortcuts-help">
        <span><kbd>↵</kbd> Ouvrir</span>
        <span><kbd>Tab</kbd> Verrouiller Artiste</span>
        <span><kbd>Esc</kbd> Fermer</span>
      </div>
      <div class="theme-switcher">
        <span>Thème :</span>
        <button class="theme-btn active" onclick="setTheme('dark')">Sombre</button>
        <button class="theme-btn" onclick="setTheme('oled')">OLED</button>
        <button class="theme-btn" onclick="setTheme('light')">Clair</button>
      </div>
    </div>
  </div>

  <div id="actionToast">Application lancée avec succès !</div>

  <script>
    const sampleApps = [
      { id: 1, tab: 'portable', title: 'VS Code Portable', sub: 'E:\\App\\All\\VSCode.exe', meta: '0.12s', icon: '💻' },
      { id: 2, tab: 'portable', title: 'Git Bash', sub: 'E:\\App\\All\\Git\\git-bash.exe', meta: 'Shell', icon: '⚡' },
      { id: 3, tab: 'portable', title: 'VLC Media Player Portable', sub: 'E:\\App\\All\\VLC\\vlc.exe', meta: 'Lecteur', icon: '🎬' },
      { id: 4, tab: 'portable', title: '7-Zip File Manager', sub: 'E:\\App\\All\\7zip.exe', meta: 'Utilitaire', icon: '📦' },
      { id: 5, tab: 'notes', title: 'Idées Projets 2026.md', sub: 'Notes perso • 34 lignes • Modifié hier', meta: 'Markdown', icon: '📝' },
      { id: 6, tab: 'notes', title: 'Architecture PassApp & Sécurité.md', sub: 'Spécification technique Rust/Tauri', meta: 'Markdown', icon: '🔒' },
      { id: 7, tab: 'music', title: 'Get Lucky', artist: 'Daft Punk', album: 'Random Access Memories', duration: '4:08', meta: 'FLAC 24-bit', icon: '🎵' },
      { id: 8, tab: 'music', title: 'Instant Crush', artist: 'Daft Punk', album: 'Random Access Memories', duration: '5:37', meta: 'FLAC 24-bit', icon: '🎵' },
      { id: 9, tab: 'music', title: 'Around The World', artist: 'Daft Punk', album: 'Homework', duration: '7:09', meta: 'MP3 320k', icon: '🎵' },
      { id: 10, tab: 'music', title: 'Strobe', artist: 'deadmau5', album: 'For Lack of a Better Name', duration: '10:37', meta: 'FLAC', icon: '🎵' },
      { id: 11, tab: 'music', title: 'Resonance', artist: 'HOME', album: 'Odyssey', duration: '3:32', meta: 'Synthwave', icon: '🎵' },
      { id: 12, tab: 'discover', title: 'Obsidian Notes', sub: 'Gestion de base de connaissances connectée', meta: 'App', icon: '💎' },
      { id: 13, tab: 'discover', title: 'Postman Local', sub: 'Test et automatisation d\'API REST', meta: 'Dev', icon: '🚀' },
      { id: 14, tab: 'games', title: 'Celeste TI-84 Edition', sub: 'D:\\Jeux\\CelesteTI\\cemu.exe', meta: 'Émulateur', icon: '🍓' },
      { id: 15, tab: 'games', title: 'Démineur Ultime', sub: 'Local build web 60 FPS', meta: 'Casual', icon: '💣' }
    ];

    let currentTab = 'all';
    let lockedArtist = null;
    let selectedIndex = 0;
    let filteredList = [];

    const input = document.getElementById('launcherInput');
    const resultsContainer = document.getElementById('resultsList');
    const pill = document.getElementById('lockedPill');
    const pillText = document.getElementById('lockedPillText');

    function selectTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      render();
    }

    function unlockArtist() {
      lockedArtist = null;
      pill.style.display = 'none';
      render();
    }

    function render() {
      const query = input.value.trim().toLowerCase();

      filteredList = sampleApps.filter(item => {
        if (currentTab !== 'all' && item.tab !== currentTab) return false;
        if (lockedArtist) {
          if (item.tab !== 'music' || item.artist.toLowerCase() !== lockedArtist.toLowerCase()) return false;
        }
        if (!query) return true;
        const matchTitle = item.title.toLowerCase().includes(query);
        const matchSub = (item.sub || '').toLowerCase().includes(query);
        const matchArtist = (item.artist || '').toLowerCase().includes(query);
        const matchAlbum = (item.album || '').toLowerCase().includes(query);
        return matchTitle || matchSub || matchArtist || matchAlbum;
      });

      if (selectedIndex >= filteredList.length) selectedIndex = 0;

      if (filteredList.length === 0) {
        resultsContainer.innerHTML = `
          <div style="padding: 30px; text-align: center; color: var(--muted); font-size: 13px;">
            Aucun résultat trouvé pour "${input.value}"
          </div>
        `;
        return;
      }

      resultsContainer.innerHTML = filteredList.map((item, idx) => {
        const isSelected = idx === selectedIndex;
        let subText = item.sub;
        if (item.tab === 'music') {
          subText = `${item.artist} • ${item.album} • ${item.duration}`;
        }
        return `
          <div class="result-item ${isSelected ? 'selected' : ''}" onclick="launchItem(${idx})" onmouseenter="selectedIndex=${idx}; highlightSelected();">
            <div class="item-left">
              <div class="item-icon">${item.icon}</div>
              <div class="item-info">
                <div class="item-title">${item.title}</div>
                <div class="item-sub">${subText}</div>
              </div>
            </div>
            <div class="item-meta">${item.meta}</div>
          </div>
        `;
      }).join('');
    }

    function highlightSelected() {
      const items = document.querySelectorAll('.result-item');
      items.forEach((it, i) => it.classList.toggle('selected', i === selectedIndex));
    }

    function launchItem(idx) {
      const item = filteredList[idx];
      if (!item) return;
      const toast = document.getElementById('actionToast');
      toast.innerText = `Lancement de "${item.title}"...`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    input.addEventListener('input', () => {
      selectedIndex = 0;
      render();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (filteredList.length > 0) {
          selectedIndex = (selectedIndex + 1) % filteredList.length;
          highlightSelected();
          scrollSelectedIntoView();
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (filteredList.length > 0) {
          selectedIndex = (selectedIndex - 1 + filteredList.length) % filteredList.length;
          highlightSelected();
          scrollSelectedIntoView();
        }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        launchItem(selectedIndex);
      } else if (e.key === 'Tab') {
        // Tab-lock artist feature!
        e.preventDefault();
        const currentItem = filteredList[selectedIndex];
        if (currentItem && currentItem.tab === 'music') {
          lockedArtist = currentItem.artist;
          pillText.innerText = `🎵 ${lockedArtist}`;
          pill.style.display = 'inline-flex';
          input.value = '';
          render();
        }
      } else if (e.key === 'Escape') {
        if (lockedArtist) {
          unlockArtist();
        } else {
          input.value = '';
          render();
        }
      }
    });

    function scrollSelectedIntoView() {
      const selectedEl = resultsContainer.children[selectedIndex];
      if (selectedEl) selectedEl.scrollIntoView({ block: 'nearest' });
    }

    function setTheme(theme) {
      document.body.className = theme === 'oled' ? 'theme-oled' : theme === 'light' ? 'theme-light' : '';
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase() === (theme === 'dark' ? 'sombre' : theme));
      });
    }

    render();
  </script>
</body>
</html>
