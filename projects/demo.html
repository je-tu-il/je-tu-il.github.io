<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Démo | Je-tu-il</title>
  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <link rel="stylesheet" href="demo.css">
  <script defer src="../data/projects.js"></script>
  <script defer src="../data/demo-scenes.js"></script>
  <script defer src="workflows.js"></script>
  <script defer src="demo.js"></script>
</head>
<body class="fullscreen-demo">
  <a href="../index.html#catalogue" class="btn-back-portfolio" aria-label="Retour au portfolio" title="Retour au portfolio">←</a>
  <main class="demo-stage" aria-labelledby="title">
    <h1 id="title">Démo</h1>
    <p id="description" class="project-desc-text"></p>
    <div id="workflow" hidden></div>
    <section id="scenario" hidden aria-labelledby="scenario-title">
      <h2 id="scenario-title">Exemple guidé</h2>
      <form id="controls">
        <div id="inputs"></div>
        <div class="actions">
          <button id="run" type="submit"></button>
          <button id="reset" type="reset">Recommencer</button>
        </div>
      </form>
      <p id="result" role="status" aria-atomic="true"></p>
    </section>
    <p id="unavailable" hidden>Cette démo est introuvable.</p>
    <noscript>Activez JavaScript pour lancer la démo.</noscript>
  </main>
</body>
</html>
